name: Daily Database Backup

on:
  schedule:
    # Запускать каждый день в 00:00 (по UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать бэкап вручную из панели GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Создаем дамп базы данных
          # Флаг -O отключает сохранение владельца объектов (удобно для восстановления)
          # Флаг -x отключает сохранение прав доступа (привилегий)
          pg_dump "$DATABASE_URL" -O -x > database_backup_$(date +%Y-%m-%d).sql

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: database_backup_*.sql
          retention-days: 90 # Хранить бэкапы 90 дней
